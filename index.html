<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fringe Analysis</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
  <script defer src="script.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f7f9fc;
      color: #333;
      padding: 1rem;
    }
    .form-section {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 1rem;
      margin-bottom: 1rem;
      max-width: 100%;
    }
    .form-inline {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .input-grouped {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .input-grouped .form-inline {
      flex: 1;
    }
    label {
      white-space: nowrap;
      font-size: 0.9rem;
    }
    input[type="file"], input[type="number"] {
      flex: 1;
    }
    #loadingBanner {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1050;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      text-align: center;
      background: #ffc;
      font-size: 0.9rem;
      padding: 0.5rem;
    }
    #loadingBanner.show { opacity: 1; pointer-events: auto; }
    #resultFrame {
      width: 100%;
      border: none;
      height: 60vh;
    }
  </style>
</head>
<body>
<div id="loadingBanner" class="alert m-0" role="alert">
  <span id="loadingText">Loading...</span>
</div>

<div class="form-section">
  <form id="analysisForm" onsubmit="runAnalysis(); return false;">

    <!-- Reference and Shot on same line -->
    <div class="input-grouped">
      <div class="form-inline">
        <label for="fileRef">Ref</label>
        <input type="file" class="form-control form-control-sm" id="fileRef">
      </div>
      <div class="form-inline">
        <label for="fileShot">Shot</label>
        <input type="file" class="form-control form-control-sm" id="fileShot">
      </div>
    </div>

    <!-- Frequency, Angles, Cutoff on same line -->
    <div class="input-grouped">
      <div class="form-inline">
        <label for="wlSteps">Freq</label>
        <input id="wlSteps" type="number" class="form-control form-control-sm" value="10" min="1" required>
      </div>
      <div class="form-inline">
        <label for="alSteps">Angles</label>
        <input id="alSteps" type="number" class="form-control form-control-sm" value="15" min="1" required>
      </div>
      <div class="form-inline">
        <label for="paramCutoff">Cutoff</label>
        <input type="number" class="form-control form-control-sm" id="paramCutoff" value="0.1" min="0" step="0.01" required>
      </div>
    </div>

    <!-- Buttons -->
    <div class="row g-2 mt-2">
      <div class="col-6">
        <button type="submit" class="btn btn-primary btn-sm w-100" id="runBtn" disabled>Run</button>
      </div>
      <div class="col-6">
        <a id="downloadLink" class="btn btn-success btn-sm w-100" href="#" download="output.tiff">Download</a>
      </div>
    </div>

  </form>
</div>

<!-- Scrollable wrapper -->
<div id="iframeWrapper" style="width: 100%; overflow-x: auto;">
  <iframe id="resultFrame" onload="resizeIframe()" style="border: none; display: block;"></iframe>
</div>

<script>
  function resizeIframe() {
    const iframe = document.getElementById('resultFrame');
    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
    if (iframeDoc && iframeDoc.body) {
      iframe.style.height = iframeDoc.body.scrollHeight + 'px';
      iframe.style.width = iframeDoc.body.scrollWidth + 'px'; // <-- ADD THIS
    }
  }
  window.addEventListener('resize', resizeIframe);
</script>

<script>
  function resizeIframe() {
    const iframe = document.getElementById('resultFrame');
    if (iframe.contentWindow.document.body) {
      iframe.style.height = iframe.contentWindow.document.body.scrollHeight + 'px';
    }
  }

  window.addEventListener('resize', resizeIframe);
</script>
